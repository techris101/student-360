name: Ingestion Pipeline

on:
  schedule:
    # Midnight in Kigali (UTC+2) -> 22:00 UTC
    - cron: "0 22 * * *"
    # Midday in Kigali (UTC+2) -> 10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    name: Crawl, Extract & Ingest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Ingestion Pipeline
        run: pnpm exec tsx scripts/pipeline/run.ts
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://student-360.vercel.app
          AI_MODEL_FAST: gemini-2.5-flash-lite
          AI_MODEL_SMART: gemini-2.5-flash
          PIPELINE_MAX_LLM_CALLS: 200
