name: Weekly Digest

on:
  schedule:
    # 07:00 Kigali time (UTC+2) -> 05:00 UTC every Monday
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  digest:
    name: Generate & Dispatch Weekly Digest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Weekly Digest Generation
        run: pnpm exec tsx scripts/pipeline/digest.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://student-360.vercel.app
